name: Moodle Plugin CI

on: [push, pull_request]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3']
        moodle-branch: ['MOODLE_500_STABLE', 'MOODLE_501_STABLE']
        database: [pgsql, mariadb]

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci add-plugin mebis-lp/moodle-local_ai_manager
          moodle-plugin-ci add-plugin bycs-lp/moodle-block_ai_chat
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          # Uncomment this to run Behat tests using the Moodle App.
          # MOODLE_APP: 'true'

      - name: Pre-Code Review - Changed Files Detection
        if: github.event_name == 'pull_request'
        uses: tj-actions/changed-files@v41
        id: changed-files
        with:
          files: |
            **/*.php
            **/*.js
            **/*.mustache

      - name: Pre-Code Review - Quick Complexity Check
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd plugin
          echo "🔍 Analyzing code complexity..."
          find . -name "*.php" -type f -exec wc -l {} \; | awk '{if($1>500) print "⚠️ File "$2" has "$1" lines (consider splitting)"}' || true

          # Prüfe auf typische Anti-Patterns
          echo "🔍 Checking for common anti-patterns..."
          grep -r "var_dump\|print_r\|die(" --include="*.php" . && echo "⚠️ Debug statements found!" || echo "✅ No debug statements"
          grep -r "TODO\|FIXME\|XXX" --include="*.php" . && echo "⚠️ TODOs found!" || echo "✅ No TODOs"

      - name: Pre-Code Review - Moodle Specific Checks
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd plugin
          echo "🔍 Moodle-specific checks..."

          # Prüfe auf MOODLE_INTERNAL
          find . -name "*.php" -type f ! -path "*/vendor/*" ! -path "*/tests/fixtures/*" -exec grep -L "defined('MOODLE_INTERNAL') || die()" {} \; | head -10 | while read file; do echo "⚠️ Missing MOODLE_INTERNAL check in: $file"; done || echo "✅ MOODLE_INTERNAL checks present"

          # Prüfe auf PHPDoc
          find . -name "*.php" -type f ! -path "*/vendor/*" ! -path "*/tests/fixtures/*" -exec grep -L "@package\|@copyright\|@license" {} \; | head -10 | while read file; do echo "⚠️ Missing PHPDoc headers in: $file"; done || echo "✅ PHPDoc headers present"

          # Prüfe auf deprecated functions
          grep -r "mysql_\|ereg\|split(" --include="*.php" --exclude-dir=vendor . && echo "⚠️ Deprecated PHP functions found!" || echo "✅ No deprecated functions"

      - name: Pre-Code Review - Security Check
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd plugin
          echo "🔍 Security checks..."

          # SQL Injection Risiken
          grep -rn "execute_sql\|get_records_sql.*\\\$" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . && echo "⚠️ Review SQL queries for injection risks!" || echo "✅ No suspicious SQL patterns"

          # XSS Risiken
          grep -rn "echo.*\\\$_\|print.*\\\$_" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . && echo "⚠️ Potential XSS risk - check output escaping!" || echo "✅ No direct output of user input"

          # File inclusion
          grep -rn "include.*\\\$\|require.*\\\$" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . && echo "⚠️ Dynamic includes found - review carefully!" || echo "✅ No dynamic includes"

          # Capability checks
          grep -rn "require_capability\|has_capability" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . | wc -l | xargs echo "✅ Found capability checks:"

      - name: Pre-Code Review - Performance Check
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd plugin
          echo "⚡ Performance checks..."

          # N+1 Query Pattern (Queries in loops)
          grep -rn "foreach\|while\|for " --include="*.php" --exclude-dir=vendor --exclude-dir=tests . | while read line; do
            file=$(echo "$line" | cut -d: -f1)
            linenum=$(echo "$line" | cut -d: -f2)
            next_lines=$(sed -n "${linenum},$((linenum+10))p" "$file" 2>/dev/null || echo "")
            if echo "$next_lines" | grep -q "\$DB->get_record\|\$DB->get_records"; then
              echo "⚠️ Potential N+1 query in $file:$linenum - Review if query can be moved outside loop"
            fi
          done | head -5 || echo "✅ No obvious N+1 query patterns"

          # Inefficient get_records without limit
          grep -rn "get_records([^)]*)" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . | grep -v "get_records_sql\|get_records_select" | head -5 | while read line; do
            if ! echo "$line" | grep -q "LIMIT\|limitfrom\|limitnum"; then
              echo "⚠️ get_records without limit: $line (consider adding limit)"
            fi
          done || echo "✅ No get_records without limits found"

          # Using get_records when get_record would suffice
          grep -rn "get_records.*\[0\]\|get_records.*->first()" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . | head -3 | while read line; do
            echo "⚠️ Using get_records()[0] instead of get_record(): $line"
          done || echo "✅ No inefficient get_records usage"

      - name: Pre-Code Review - Moodle Best Practices
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd plugin
          echo "📚 Moodle best practices checks..."

          # Check for optional_param_array usage
          grep -rn "\\\$_GET\\\[\|\\\$_POST\\\[" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . | head -5 | while read line; do
            echo "⚠️ Direct superglobal access (use required_param/optional_param): $line"
          done || echo "✅ No direct superglobal access"

          # Check if version.php was updated (if db/install.xml or db/upgrade.php changed)
          if git diff --name-only origin/main 2>/dev/null | grep -q "db/install.xml\|db/upgrade.php"; then
            if ! git diff --name-only origin/main 2>/dev/null | grep -q "version.php"; then
              echo "⚠️ DB schema changed but version.php not updated!"
            else
              echo "✅ version.php updated with DB changes"
            fi
          else
            echo "✅ No DB schema changes detected"
          fi

          # Check for new capabilities in db/access.php
          if git diff origin/main -- . 2>/dev/null | grep -q "require_capability.*:"; then
            if [ -f "db/access.php" ]; then
              echo "✅ access.php exists for capability definitions"
            else
              echo "⚠️ Capabilities used but db/access.php missing!"
            fi
          fi

          # Check for clean_param usage
          grep -rn "clean_param" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . | wc -l | xargs echo "ℹ️ Found clean_param usages:"

      - name: Pre-Code Review - String Management
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd plugin
          echo "🔤 String management checks..."

          # Check for hardcoded strings (excluding common ones)
          grep -rn "echo.*['\"][A-Z]" --include="*.php" --exclude-dir=vendor --exclude-dir=tests --exclude-dir=lang . | grep -v "get_string\|@\|TODO\|FIXME\|DEBUG\|SQL" | head -5 | while read line; do
            echo "⚠️ Potential hardcoded string: $line"
          done || echo "✅ No obvious hardcoded strings"

          # Check if new strings were added to lang files
          if git diff origin/main -- lang/en/*.php 2>/dev/null | grep -q "^+.*=>"; then
            echo "✅ New language strings added"
            git diff origin/main -- lang/en/*.php 2>/dev/null | grep "^+.*=>" | head -5
          else
            # Check if PHP files changed but no lang files
            if git diff --name-only origin/main 2>/dev/null | grep -q "\.php$" && ! git diff --name-only origin/main 2>/dev/null | grep -q "lang/"; then
              echo "ℹ️ PHP files changed but no language strings added (might be OK)"
            else
              echo "✅ No new language strings needed"
            fi
          fi

          # Check for missing translations (if lang/en exists, check if lang/de exists too)
          if [ -d "lang/en" ]; then
            for enfile in lang/en/*.php; do
              filename=$(basename "$enfile")
              if [ ! -f "lang/de/$filename" ] 2>/dev/null; then
                echo "⚠️ Missing German translation: lang/de/$filename"
              fi
            done || echo "✅ All translations present"
          fi

      - name: Pre-Code Review - Security Deep-Dive
        if: github.event_name == 'pull_request' && steps.changed-files.outputs.any_changed == 'true'
        run: |
          cd plugin
          echo "🔒 Security deep-dive checks..."

          # Check for eval() usage
          grep -rn "eval(" --include="*.php" --exclude-dir=vendor . && echo "❌ eval() found - HIGH SECURITY RISK!" || echo "✅ No eval() usage"

          # Check for unsafe file operations
          grep -rn "file_get_contents.*http\|curl_exec\|fopen.*http" --include="*.php" --exclude-dir=vendor --exclude-dir=tests . | head -3 | while read line; do
            echo "⚠️ Remote file operation (verify URL validation): $line"
          done || echo "✅ No remote file operations"

          # Check for missing sesskey in forms
          grep -rn "new moodleform\|class.*extends.*moodleform" --include="*.php" --exclude-dir=vendor . | while read line; do
            file=$(echo "$line" | cut -d: -f1)
            if ! grep -q "sesskey" "$file"; then
              echo "⚠️ Form without sesskey check: $file (CSRF risk)"
            fi
          done | head -3 || echo "✅ Forms have CSRF protection"

          # Check for unserialize usage
          grep -rn "unserialize(" --include="*.php" --exclude-dir=vendor . && echo "⚠️ unserialize() found - verify data source is trusted!" || echo "✅ No unserialize() usage"

          # Check for command execution
          grep -rn "exec(\|shell_exec(\|system(\|passthru(" --include="*.php" --exclude-dir=vendor . && echo "❌ Command execution found - SECURITY RISK!" || echo "✅ No command execution"

      - name: Pre-Code Review - Generate Report
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const fs = require('fs');

            const issues = [];
            const warnings = [];
            const successes = [];

            try {
              // PHP Syntax Check
              const phpFiles = execSync('cd plugin && find . -name "*.php" -type f ! -path "*/vendor/*"', { encoding: 'utf8' }).trim().split('\n');
              let syntaxErrors = 0;

              for (const file of phpFiles.slice(0, 50)) { // Limit to first 50 files
                try {
                  execSync(`php -l plugin/${file}`, { encoding: 'utf8', stdio: 'pipe' });
                } catch (error) {
                  syntaxErrors++;
                  issues.push(`❌ PHP Syntax error in: ${file}`);
                }
              }

              if (syntaxErrors === 0) {
                successes.push('✅ No PHP syntax errors found');
              }
            } catch (error) {
              warnings.push('⚠️ Could not complete PHP syntax check');
            }

            // Create review comment
            const changedFiles = '${{ steps.changed-files.outputs.all_changed_files }}'.split(' ').filter(f => f);

            let body = `## 🤖 Automated Pre-Code Review

            **Matrix:** PHP ${{ matrix.php }} | Moodle ${{ matrix.moodle-branch }} | DB ${{ matrix.database }}

            ### 📝 Changed Files (${changedFiles.length})
            ${changedFiles.slice(0, 10).map(f => `- \`${f}\``).join('\n')}
            ${changedFiles.length > 10 ? `\n... and ${changedFiles.length - 10} more` : ''}
            `;

            if (issues.length > 0) {
              body += `\n### ❌ Critical Issues Found:\n${issues.slice(0, 10).join('\n')}`;
              if (issues.length > 10) body += `\n... and ${issues.length - 10} more`;
            }

            if (warnings.length > 0) {
              body += `\n### ⚠️ Warnings:\n${warnings.slice(0, 10).join('\n')}`;
            }

            if (successes.length > 0) {
              body += `\n### ✅ Successful Checks:\n${successes.join('\n')}`;
            }

            body += `

            ### 📋 Manual Review Checklist:
            - [ ] **Moodle Coding Standards** fully compliant
            - [ ] **PHPDoc** complete and correct (Package, Copyright, License)
            - [ ] **Security**:
              - [ ] All inputs validated with \`required_param()\` / \`optional_param()\`
              - [ ] All outputs escaped with \`s()\`, \`format_text()\` or \`html_writer\`
              - [ ] Capability checks with \`require_capability()\` present
            - [ ] **Database**:
              - [ ] Only Core DB API used (\`$DB->get_record()\`, etc.)
              - [ ] SQL parameters properly bound (no string concatenation)
            - [ ] **Tests**:
              - [ ] PHPUnit tests present/updated
              - [ ] Behat tests for new features
            - [ ] **Code Quality**:
              - [ ] No debug output (var_dump, print_r, die)
              - [ ] No TODOs in production code
              - [ ] Functions < 50 lines, Classes < 500 lines
            - [ ] **Moodle Standards**:
              - [ ] Strings in language files (\`lang/en/\`)
              - [ ] \`MOODLE_INTERNAL\` check in all PHP files
              - [ ] Upgrade steps documented in \`db/upgrade.php\`

            ---
            💡 **Tip:** Run locally \`../bindev/codechecker.sh report/ai_analysis\` and \`../bindev/moodlecheck.sh report/ai_analysis\`!
            `;

            // Only post one comment per matrix combination and only for pull requests
            if (context.payload.pull_request &&
                context.issue && context.issue.number &&
                '${{ matrix.php }}' === '8.3' &&
                '${{ matrix.database }}' === 'pgsql' &&
                '${{ matrix.moodle-branch }}' === 'MOODLE_501_STABLE') {
              try {
                await github.rest.issues.createComment({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  body: body
                });
                console.log('✅ Pre-code review comment posted successfully');
              } catch (error) {
                console.log('⚠️ Could not post comment:', error.message);
              }
            } else {
              console.log('ℹ️ Skipping comment (not a PR or not the primary matrix combination)');
            }

      - name: PHP Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phplint

      - name: Moodle Code Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

      - name: Behat features
        id: behat
        if: ${{ !cancelled() }}
        run: moodle-plugin-ci behat --profile chrome

      - name: Upload Behat Faildump
        if: ${{ failure() && steps.behat.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: Behat Faildump (${{ join(matrix.*, ', ') }})
          path: ${{ github.workspace }}/moodledata/behat_dump
          retention-days: 7
          if-no-files-found: ignore

      - name: Mark cancelled jobs as failed.
        if: ${{ cancelled() }}
        run: exit 1
